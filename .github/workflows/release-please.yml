name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize main-branch release processing; never cancel an active publish.
concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/checkout@v7

      # release-please must authenticate as a GitHub App: PRs created with
      # GITHUB_TOKEN do not trigger CI, so the release PR could never pass the
      # required `check`.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install MCP Registry publisher
        run: |
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          # Track the latest release rather than pinning: this is a directory
          # publishing CLI, not part of the shipped artifact.
          curl -fsSL -o "$archive" https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar xzf "$archive" mcp-publisher

      - name: Validate MCP registry metadata
        run: ./mcp-publisher validate

      # Idempotent: a retry after a partial failure must not fail because the
      # version is already published; it should fall through to the registry step.
      - name: Publish to npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping"
          else
            npm publish --provenance --access public
          fi

      # The registry validates that the npm version exists, and npm's CDN can lag
      # the publish by minutes, so the budget is generous.
      - name: Publish to MCP Registry
        run: |
          max=10
          for n in $(seq 0 $((max - 1))); do
            if [ "$n" -gt 0 ]; then
              wait=$((n <= 5 ? n * 30 : 300))
              echo "Retry $n/$((max - 1)) in ${wait}s..."
              sleep "$wait"
            fi
            echo "MCP Registry publish attempt $((n + 1))/$max..."
            ./mcp-publisher login github-oidc
            if output=$(./mcp-publisher publish 2>&1); then
              printf '%s\n' "$output"
              echo "MCP Registry publish succeeded"
              exit 0
            else
              status=$?
            fi

            printf '%s\n' "$output"
            if [[ "$output" == *"was not found"* || "$output" == *"server returned status 429"* || "$output" == *"server returned status 5"* ]]; then
              echo "Publish failed with a retryable registry error (exit $status)."
              continue
            fi

            echo "Publish failed with a non-retryable error (exit $status)."
            exit "$status"
          done
          echo "MCP Registry publish failed after $max attempts"
          exit 1
