name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize main-branch release processing; never cancel an active publish.
concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/checkout@v7

      # RELEASE_PLEASE_TOKEN is a classic PAT with contents:write and
      # pull_requests:write scopes, so release-please PRs trigger CI.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate MCP registry metadata
        uses: studiomeyer-io/mcp-passport@v0.1.0
        with:
          path: .
          fail-on: error

      # Trusted publishing: the package must already exist on npm with a trusted
      # publisher configured for this repository. The very first publish is done
      # manually; see CONTRIBUTING.md.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Install MCP Registry publisher
        run: |
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl -fsSL -o "$archive" https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  '"$archive" | sha256sum --check
          tar xzf "$archive" mcp-publisher

      - name: Publish to MCP Registry
        run: |
          max=5
          for n in $(seq 0 $((max - 1))); do
            if [ "$n" -gt 0 ]; then
              wait=$((2 ** (n - 1) * 15))
              echo "Retry $n/$((max - 1)) in ${wait}s..."
              sleep "$wait"
            fi
            echo "MCP Registry publish attempt $((n + 1))/$max..."
            ./mcp-publisher login github-oidc
            if output=$(./mcp-publisher publish 2>&1); then
              printf '%s\n' "$output"
              echo "MCP Registry publish succeeded"
              exit 0
            else
              status=$?
            fi

            printf '%s\n' "$output"
            if [[ "$output" == *"was not found"* || "$output" == *"server returned status 429"* || "$output" == *"server returned status 5"* ]]; then
              echo "Publish failed with a retryable registry error (exit $status)."
              continue
            fi

            echo "Publish failed with a non-retryable error (exit $status)."
            exit "$status"
          done
          echo "MCP Registry publish failed after $max attempts"
          exit 1
