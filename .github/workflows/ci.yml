name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

# Auto-cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check formatting, lint, types, and tests
        run: just check
